# Optional local development dependencies for CodeAtlas. Nothing here is exposed beyond 127.0.0.1.
# CodeAtlas itself needs no services; this only provides a local model for Ask, module overviews
# and model-proposed patches.
#   docker compose -f infrastructure/local-development/docker-compose.yml up -d
#   docker compose -f infrastructure/local-development/docker-compose.yml exec ollama ollama pull qwen2.5:7b-instruct
name: codeatlas-dev
services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
      - '127.0.0.1:11434:11434'
    volumes:
      - codeatlas-ollama:/root/.ollama

volumes:
  codeatlas-ollama:
