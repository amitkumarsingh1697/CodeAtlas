# Continuous integration for CodeAtlas and ArchLens.
name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: node skills/archlens/scripts/check.mjs
      - run: pnpm audit --prod
      - name: Third-party notices are current (LIC-001)
        run: node scripts/third-party-notices.mjs --check
      - name: SBOM and checksums (PKG-005)
        run: |
          mkdir -p dist/supply-chain
          node scripts/sbom.mjs --out dist/supply-chain/sbom.cdx.json --checksum \
            skills/archlens/scripts/brain/brain.mjs skills/archlens/scripts/brain/runtime.pack.gz \
            skills/archlens/scripts/brain/web-tree-sitter.wasm
          (cd dist/supply-chain && sha256sum -c SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: dist/supply-chain
      - run: pnpm --filter @nexora/codeatlas-web build
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: products/codeatlas/web
      - name: CodeAtlas E2E
        run: pnpm --filter @nexora/codeatlas-web e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: products/codeatlas/web/playwright-report
  egress:
    # PKG-004: index, assessment and brain with the network denied (DATA_FLOW.md section 2).
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Network-denied index, assessment and brain
        run: scripts/egress-check.sh
